name: Build TalkBack APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Install Android SDK pieces
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build phone debug APK
        shell: bash
        run: |
          set +e
          gradle assemblePhoneDebug --no-daemon 2>&1 | tee build_output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          import re
          log=open('build_output.log',errors='ignore').read().splitlines()
          keep=[]
          for i,l in enumerate(log):
              if 'What went wrong' in l:
                  keep.extend(x.strip() for x in log[i:i+5])
              elif re.search(r'^e: |error:|Execution failed|Could not|Unresolved|cannot find symbol|FAILURE', l, re.I):
                  keep.append(l.strip())
          seen=set(); out=[]
          for l in keep:
              if l and l not in seen:
                  seen.add(l); out.append(l)
          out=out[:64]
          for c in [out[i:i+8] for i in range(0,len(out),8)][:8]:
              print('::error::'+'%0A'.join(x.replace('%','%25')[:400] for x in c))
          PY
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: talkback-debug-apk
          path: "**/build/outputs/apk/**/*.apk"
