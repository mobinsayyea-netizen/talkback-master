name: Build Advanced Screen Reader APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Install Android SDK pieces
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" || true

      - name: Prepare AI Create compiler files
        run: |
          A=talkback/src/main/assets/ms_compiler
          mkdir -p "$A"
          cp talkback/src/main/java/ms/api/MsApi.java talkback/src/main/java/ms/api/MsPlugin.java "$A"/
          JAR=$(ls "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)
          echo "Using $JAR"
          python3 - "$JAR" "$A/android.jar" <<'PY'
          import sys, zipfile
          src, dst = sys.argv[1], sys.argv[2]
          drop = ("android/icu/", "android/renderscript/", "android/test/", "android/testing/", "android/companion/", "android/health/", "android/nfc/", "android/print/", "android/mtp/", "android/gesture/", "META-INF/", "res/", "junit/", "org/apache/", "org/junit/")
          with zipfile.ZipFile(src) as zi, zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as zo:
              for i in zi.infolist():
                  n = i.filename
                  if i.is_dir() or n.startswith(drop) or not n.endswith(".class"):
                      continue
                      
                  zo.writestr(n, zi.read(n))
          PY
          ls -l "$A"

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build phone APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          gradle assemblePhoneDebug --no-daemon 2>&1 | tee build_output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          import re
          log=open('build_output.log',errors='ignore').read().splitlines()
          keep=[]
          for i,l in enumerate(log):
              if 'What went wrong' in l:
                  keep.extend(x.strip() for x in log[i:i+6])
              elif re.search(r'^e: |error:|Execution failed|Could not|Unresolved|cannot find symbol|FAILURE|AAPT|resource', l, re.I):
                  keep.append(l.strip())
          seen=set(); out=[]
          for l in keep:
              if l and l not in seen:
                  seen.add(l); out.append(l)
          out=out[:64]
          for c in [out[i:i+8] for i in range(0,len(out),8)][:8]:
              print('::error::'+'%0A'.join(x.replace('%','%25')[:400] for x in c))
          PY
            exit 1
          fi

      - name: Upload build log (only if the build failed)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "buildlog-${{ github.run_number }}" build_output.log \
            --title "Build log for failed run ${{ github.run_number }}" \
            --notes "Full gradle output from the failed build. Safe to delete once read." \
            --prerelease

      - name: Name the APK
        run: |
          APK=$(find . -path "*outputs/apk/phone/debug/*.apk" | head -1)
          if [ -z "$APK" ]; then APK=$(find . -path "*outputs/apk*" -name "*.apk" ! -name "*wear*" | head -1); fi
          echo "Found: $APK"
          cp "$APK" MSScreenReader.apk

      - name: Make smaller 64-bit-only APK (same key, updates in place)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          cp MSScreenReader.apk tmp64.apk
          zip -q -d tmp64.apk 'lib/armeabi-v7a/*' || true
          "$BT/zipalign" -f -p 4 tmp64.apk aligned64.apk
          "$BT/apksigner" sign --ks "$KEYSTORE_PATH" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out MSScreenReader-64bit.apk aligned64.apk
          "$BT/apksigner" verify MSScreenReader-64bit.apk
          ls -l MSScreenReader.apk MSScreenReader-64bit.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ms-screen-reader-apk
          path: MSScreenReader.apk

      - name: Publish release (direct APK download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" MSScreenReader.apk MSScreenReader-64bit.apk \
            --title "Advanced Screen Reader build ${{ github.run_number }}" \
            --notes "Automatic build from commit ${{ github.sha }}" \
            --latest

  emulator-test:
    # Runs the new APK on an emulator: compiles, loads and runs a Java extension (AI Create self test).
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: ms-screen-reader-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run self test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r MSScreenReader.apk
            adb logcat -c
            adb shell am start -n com.mobeen.msscreenreader/com.google.android.accessibility.talkback.editor.AiSelfTestActivity
            for i in $(seq 1 60); do adb logcat -d -s MsSelfTest | grep -q "RESULT:" && break; sleep 3; done
            adb logcat -d -s MsSelfTest AndroidRuntime > selftest.log
            cat selftest.log
            grep -q "RESULT: PASS" selftest.log

      - name: Upload self test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log
          path: selftest.log
          if-no-files-found: ignore
